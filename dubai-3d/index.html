<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#2b8fd8" />
  <title>Dubai in 3D</title>
  <meta name="description" content="An interactive, painted miniature-city 3D map of Dubai built from OpenStreetMap, Overture Maps and Copernicus DEM." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232b8fd8'/%3E%3Cpath d='M16 4l2 22h-4z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="map"></div>
  <div id="labels" aria-hidden="true"></div>

  <header class="panel title">
    <h1>Dubai <span>in 3D</span></h1>
    <div class="chips">
      <span id="clock" class="chip">--:--</span>
      <span id="weather" class="chip" hidden></span>
    </div>
  </header>

  <nav class="panel views" aria-label="Viewpoints">
    <button data-view="creek">Creek</button>
    <button data-view="downtown">Downtown</button>
    <button data-view="canal">Canal</button>
    <button data-view="coast">Coast</button>
    <button id="tour" title="Replay intro fly-over">▶ Tour</button>
  </nav>

  <section class="panel controls" aria-label="Controls">
    <div class="timebar">
      <input id="time" type="range" min="0" max="1439" step="1" aria-label="Time of day in Dubai" />
      <button id="live" class="live on" title="Follow the real time in Dubai">● Live</button>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="t-painted" /> Painted</label>
      <label><input type="checkbox" id="t-trains" checked /> Trains</label>
      <label><input type="checkbox" id="t-labels" checked /> Labels</label>
      <button id="lang" class="seg" title="Label language">EN</button>
    </div>
    <div id="trainnote" class="note"></div>
  </section>

  <div id="card" class="panel card" hidden></div>
  <div id="loading">Painting the city…</div>

  <footer class="attrib">Map data © OpenStreetMap contributors · Overture Maps · Terrain: Copernicus DEM © DLR, Airbus DS · Painted with AI</footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
